<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wallet - TeamForge</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<main>
  <h1>Wallet debit</h1>
  <p class="lead">Enter an account number and an amount. The Node.js server reduces the balance stored in MongoDB, but only if the account has enough money.</p>
  <div class="grid two">
    <section class="card">
      <form id="debitForm" novalidate>
        <label for="acc">Account number</label><input type="text" id="acc" placeholder="TF12345678" autocomplete="off">
        <label for="amt" style="margin-top:10px">Amount (&#8377;)</label><input type="number" id="amt" min="1" step="1" placeholder="200">
        <label for="purpose" style="margin-top:10px">Purpose</label>
        <select id="purpose"><option>Registration fee</option><option>Resource kit</option><option>Other</option></select>
        <p><button class="btn" type="submit">Debit</button> <button class="btn ghost" type="button" id="check">Check balance</button></p>
        <div id="msg" role="alert"></div>
      </form>
    </section>
    <section class="card">
      <h2 style="margin-top:0">Balance</h2>
      <p style="font-size:2rem;margin:.2em 0;font-weight:700" id="bal">-</p>
      <p class="muted" id="balAcc"></p>
      <h3>Recent debits</h3>
      <table id="hist"><thead><tr><th>Purpose</th><th>Amount</th><th>Balance after</th></tr></thead><tbody><tr><td colspan="3" class="muted">Enter an account number and press Check balance.</td></tr></tbody></table>
    </section>
  </div>
</main>
<script src="vendor/jquery.min.js"></script>
<script src="js/common.js"></script>
<script src="js/popup.js"></script>
<script src="js/pay.js"></script>
</body>
</html>
